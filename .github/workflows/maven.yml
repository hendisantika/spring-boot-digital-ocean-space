# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      # Required by the dependency submission API (Update dependency graph step)
      contents: write

    env:
      TC_CLOUD_TOKEN: ${{ secrets.TC_CLOUD_TOKEN }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Setup Testcontainers Cloud Client
      # Secrets are not available for Dependabot / fork pull requests
      if: ${{ env.TC_CLOUD_TOKEN != '' }}
      uses: atomicjar/testcontainers-cloud-setup-action@v1
      with:
        token: ${{ env.TC_CLOUD_TOKEN }}

    - name: Build with Maven
      run: ./mvnw -B package --file pom.xml

    # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive.
    # Only on push to main: pull requests (incl. Dependabot) get a read-only GITHUB_TOKEN.
    - name: Update dependency graph
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c
